[profile.default]
src = 'contracts'
out = 'out'
libs = ['lib']
test = 'tests'
script = 'scripts'
solc_version = '0.8.26'
evm_version = 'cancun'
optimizer = true
optimizer_runs = 200

# Sepolia / Anvil RPC endpoints are read from the environment by the
# deploy script (SEPOLIA_RPC_URL); nothing secret is stored here.
[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
sepolia = "${SEPOLIA_RPC_URL}"
